org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# AGP 8 butuh JDK 17+, sedangkan JDK bawaan Android Studio (jbr) cuma 11 —
# jadi JANGAN biarkan Gradle memungutnya. JDK dipilih lewat JAVA_HOME / setelan
# Flutter (`flutter config --jdk-dir=...`), bukan dipaku di sini: path absolut
# di berkas yang dilacak git akan patah di mesin lain begitu JDK-nya dicopot
# atau versinya berganti.
android.useAndroidX=true
android.enableJetifier=true
# Windows: proyek di drive D: & pub-cache di drive C: bikin Kotlin incremental
# compiler crash ("this and base files have different roots"). Matikan saja.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
