allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Sebagian plugin (mis. geolocator_android, jni) mereferensikan
    // `flutter.compileSdkVersion` / `flutter.minSdkVersion`, yang tidak di-inject
    // Flutter 3.24 ke submodul plugin. Sediakan objek penggantinya di sini
    // (kecuali :app yang punya extension `flutter` asli).
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: 36,
            minSdkVersion    : 23,
            targetSdkVersion : 35,
            ndkVersion       : "27.0.12077973",
            versionCode      : 1,
            versionName      : "1.0",
        ]
    }

    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
                buildToolsVersion "36.0.0"
                if (project.android.hasProperty("ndkVersion")) {
                    ndkVersion "27.0.12077973"
                }
            }
        }
    }

    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
