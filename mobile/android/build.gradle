allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Sebagian plugin (mis. geolocator_android) mereferensikan
    // `flutter.compileSdkVersion` / `flutter.minSdkVersion`, yang tidak di-inject
    // Flutter 3.24 ke submodul plugin. Sediakan objek penggantinya di sini
    // (kecuali :app yang punya extension `flutter` asli).
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion    : 23,
            targetSdkVersion : 33,
            versionCode      : 1,
            versionName      : "1.0",
        ]
    }

    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 34
                buildToolsVersion "34.0.0"
            }
        }
    }

    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
