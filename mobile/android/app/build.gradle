plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "id.sch.sms.sms_mobile"
    // Eksplisit (bukan flutter.compileSdkVersion) karena beberapa plugin
    // (mobile_scanner, geolocator) butuh compileSdk 34 dan properti bawaan
    // tidak ter-resolve pada setup Gradle ini.
    compileSdk = 34
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "id.sch.sms.sms_mobile"
        // Versi Android sengaja dipatok agar kompatibel & tidak terlalu tinggi:
        //  - minSdk 23  = Android 6.0 (Marshmallow) — floor untuk
        //    flutter_secure_storage `encryptedSharedPreferences`.
        //  - targetSdk 33 = Android 13 — matang & luas, bukan versi terbaru.
        //  - compileSdk tetap mengikuti Flutter (kompilasi terhadap SDK terbaru).
        minSdkVersion = 23
        targetSdk = 33
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
